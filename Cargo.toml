[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
version = "0.1.0"

# Shared dependency versions, inherited by members. No entry without a consumer.
[workspace.dependencies]
burn = { version = "0.22.1", default-features = false }
crc32fast = "1.5.3"
fancy-regex = "0.20.0"
pkg-config = "0.3.34"
regex = "1.13.1"
rustfft = "6.4.1"
safetensors = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
