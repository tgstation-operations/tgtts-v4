[package]
name = "tgtts"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[dependencies]
argh.workspace = true
axum = { workspace = true, features = ["http1", "query", "tokio"] }
blake3.workspace = true
dsp = { path = "../dsp" }
effects = { path = "../effects" }
futures-util.workspace = true
graph = { path = "../graph" }
rand = { workspace = true, features = ["thread_rng"] }
# The SQLite built in, so the binary needs no library at run time.
rusqlite = { workspace = true, features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
toml = { workspace = true, features = ["display", "parse", "serde", "std"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "std", "tracing-log"] }
vorbis_rs.workspace = true
voices = { path = "../voices" }
voxcpm = { path = "../voxcpm" }
vulkan = { path = "../vulkan" }

[build-dependencies]
pkg-config.workspace = true

[dev-dependencies]
tempfile.workspace = true
testkit = { path = "../testkit" }
tokio = { workspace = true, features = ["test-util"] }
# The HTTP client the game's rust-g makes its requests with.
ureq.workspace = true
