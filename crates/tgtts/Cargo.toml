[package]
name = "tgtts"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[features]
# The model on a Vulkan GPU, with what autotune chose there kept for the next start.
vulkan = ["burn/persistence", "dep:gpu", "gpu/vulkan"]
# The model on an NVIDIA GPU through CUDA, likewise.
cuda = ["burn/persistence", "dep:gpu", "gpu/cuda"]
# The model on tts-rs's own runtime on a Vulkan GPU, rather than on burn.
rt = ["dep:audiovae", "dep:graph", "dep:vulkan"]

[dependencies]
audiovae = { path = "../audiovae", optional = true }
axum = { workspace = true, features = ["http1", "query", "tokio"] }
blake3.workspace = true
burn = { workspace = true, features = ["flex"] }
dsp = { path = "../dsp" }
effects = { path = "../effects" }
futures-util.workspace = true
gpu = { path = "../gpu", optional = true }
graph = { path = "../graph", optional = true }
rand = { workspace = true, features = ["thread_rng"] }
# The SQLite built in, so the binary needs no library at run time.
rusqlite = { workspace = true, features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
toml = { workspace = true, features = ["parse", "std"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "std", "tracing-log"] }
vorbis_rs.workspace = true
voices = { path = "../voices" }
voxcpm = { path = "../voxcpm" }
voxcpm-core = { path = "../voxcpm-core" }
vulkan = { path = "../vulkan", optional = true }

[build-dependencies]
pkg-config.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
# The HTTP client the game's rust-g makes its requests with.
ureq.workspace = true
