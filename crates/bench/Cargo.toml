[package]
name = "bench"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[features]
# --device vulkan, keeping what autotune chose from one run to the next.
vulkan = ["burn/persistence", "dep:gpu", "gpu/vulkan"]
# --device cuda, likewise.
cuda = ["burn/persistence", "dep:gpu", "gpu/cuda"]

[dependencies]
audiovae = { path = "../audiovae" }
burn = { workspace = true, features = ["flex", "std"] }
dsp = { path = "../dsp" }
gpu = { path = "../gpu", optional = true }
libc.workspace = true
minicpm4 = { path = "../minicpm4" }
serde.workspace = true
serde_json.workspace = true
voices = { path = "../voices" }
voxcpm = { path = "../voxcpm" }
